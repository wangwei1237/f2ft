<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面对面翻译 · 交互原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#e7f0eb;color:#123e37;font:16px/1.55 Inter,"PingFang SC",sans-serif}main{max-width:820px;margin:5vh auto;display:grid;grid-template-columns:1fr 380px;gap:48px;align-items:center;padding:20px}aside h1{font-size:42px;line-height:1.15;letter-spacing:-2px}small{color:#4c6a61}article{background:#fcfcf6;border:5px solid #20473e;border-radius:34px;min-height:640px;padding:20px;box-shadow:0 15px 45px #234c3820}header,footer,.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}header{padding-bottom:12px;border-bottom:1px solid #c8d9d0}button,select{cursor:pointer;background:white;border:1px solid #bad0c6;color:#194f44;padding:9px 12px;border-radius:12px;font:inherit;min-height:44px}button:active{background:#d7ebe1}.primary{background:#146552;color:white;border:0;width:100%;font-weight:650}.panel{padding:16px;border-radius:18px;background:#e0efe6;margin:14px 0}.guest{background:#e4edf1}.turn{border:2px solid #43806b}.big{font:600 24px/1.35 Inter,sans-serif;margin:12px 0}.sub{font-size:13px;color:#45685d}.flip{transform:rotate(180deg)}footer{margin-top:16px}footer button{font-size:13px}dialog{border:0;border-radius:20px;max-width:330px;color:#194f44;padding:24px}dialog::backdrop{background:#0b302b66}textarea{width:100%;min-height:85px;font:inherit}button{touch-action:manipulation}@media(max-width:700px){main{display:block;max-width:420px;margin:auto;padding:10px}aside h1{font-size:22px}aside p{font-size:13px}article{min-height:580px}}
</style><main><aside><small>Android　/　交互原型</small><h1>面对面翻译</h1><p>在车站问一句，再听对方回答。</p><p>本原型用示例句模拟收音、翻译与播报。进入会话后点「说完示例句」体验自动交棒。打字演示支持屏幕给出的例句。</p></aside><article id="app"></article></main><dialog id="dlg"></dialog><script>
const app=document.querySelector('#app'),dlg=document.querySelector('#dlg');
const lines=[['去机场在哪个站台上车？','Which platform is it for the airport?'],['在四号站台上车。','Take the train from platform four.']];
let own=0,side=0,phase='home',flip=false,hold=false,timer,history=[],msg='',replaying=false;
const lang=['中文','English'],speak=['说中文','Speak English'],type=['打字','Type'],wait=['请说中文','Your turn · Speak English'];
function btn(label,action,cls=''){return '<button class="'+cls+'" onclick="'+action+'">'+label+'</button>'}
function listen(s){clearTimeout(timer);side=s;phase='listen';msg='';replaying=false;draw()}
function start(s){history=[];listen(s)}
function submit(){if(phase!=='listen'&&phase!=='record')return;phase='translate';draw();timer=setTimeout(()=>{history.push(side);play(false)},650)}
function play(replay){clearTimeout(timer);replaying=replay;phase='play';draw();timer=setTimeout(()=>listen(replay?side:1-side),2000)}
function panel(s){let current=side===s;let last=history.at(-1);let status=current?(phase==='listen'?(hold?(s?'Hold to speak':'按住说话'):wait[s]):phase==='record'?(s?'Listening…':'正在收音'):phase==='translate'?(s?'Translating…':'正在翻译'):(s?'Playing translation…':'正在播放译文')):(s?'English':'中文');let key=hold?'<button onpointerdown="record(event,'+s+')" onpointerup="submit()" onpointercancel="listen('+s+')">'+(s?'Hold to speak':'按住说话')+'</button>':btn(speak[s],'listen('+s+')');return '<section class="panel '+(s!==own?'guest ':'')+(flip&&s!==own?'flip ':'')+(current?'turn':'')+'"><small>'+status+'</small><div class="big">'+(last===undefined?(s?'Ready to talk':'准备对话'):lines[last][s])+'</div><div class="row">'+key+btn(type[s],'keyboard('+s+')')+'</div></section>'}
function record(e,s){clearTimeout(timer);side=s;phase='record';e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.textContent=s?'Release to send':'松开发送'}
function modal(html,close){dlg.innerHTML=html;dlg.oncancel=e=>{e.preventDefault();close()};dlg.showModal()}
function back(){dlg.close();listen(side)}
function keyboard(s){listen(s);let prompt=s?'Type the sample sentence':'输入下方示例句';modal('<p>'+prompt+'</p><small>'+lines[s][s]+'</small><textarea id="entry"></textarea>'+btn(s?'Use sample':'填入示例','entry.value=lines[side][side]')+btn(s?'Send':'发送','sendText()')+btn(s?'Cancel':'取消','back()'),back)}
function sendText(){if(document.querySelector('#entry').value.trim()!==lines[side][side]){document.querySelector('#entry').focus();return}dlg.close();submit()}
function detail(){clearTimeout(timer);modal(history.map(i=>'<p><small>'+lines[i][i]+'</small><br><strong style="font-size:24px">'+lines[i][1-i]+'</strong></p>').join('')+btn('返回 / Back','back()'),back)}
function end(){clearTimeout(timer);modal('<h3>结束并清除本次对话？</h3>'+btn('继续对话','back()')+btn('结束','finish()'),back)}
function finish(){dlg.close();history=[];phase='home';draw()}
function draw(){if(phase==='home'){app.innerHTML='<header><b>面对面翻译</b></header><h2 style="margin-top:55px">和对方说句话</h2><p>把手机放在两人之间。</p><section class="panel"><small>我的语言</small><h2>'+lang[own]+'</h2>'+btn('交换语言 ⇅','own=1-own;draw()')+'<p>对方的语言　<b>'+lang[1-own]+'</b></p></section>'+btn('开始对话','start(own)','primary')+'<p>'+btn('让对方先说','start(1-own)')+'</p><small>正式版需联网处理语音。</small>';return}app.innerHTML='<header><b>双向对话</b>'+btn('结束','end()')+'</header>'+panel(1-own)+panel(own)+(phase==='listen'&&!hold?btn(side?'Finish sample sentence · 说完示例句':'说完示例句','submit()','primary'):'')+'<footer>'+btn(flip?'并排阅读':'面对面 ⇅','flip=!flip;draw()')+btn(hold?'切到自动':'按住说话模式','hold=!hold;listen(side)')+(history.length?btn('放大 / 记录','detail()')+btn('重播最近译文','play(true)'):'')+'</footer>'}
draw();
</script></html>
