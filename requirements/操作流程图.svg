<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 950" role="img"><title>面对面翻译操作流程</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#408572"/></marker></defs><rect width="1000" height="950" fill="#f6f9f5"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#193f36"><text x="44" y="67" text-anchor="start" font-size="36">面对面翻译操作流程</text><text x="45" y="102" text-anchor="start" font-size="18">自动轮流对话　 /　 同一套流程适用于中译英和英译中</text><rect x="170" y="145" width="380" height="68" rx="14" fill="white" stroke="#a6c7b9"/><text x="186" y="172" text-anchor="start" font-size="20">开始对话</text><text x="186" y="196" text-anchor="start" font-size="14">核对双方语言，选择谁先说</text><path d="M360 213v43" fill="none" stroke="#408572" stroke-width="2" marker-end="url(#arr)"/><rect x="170" y="257" width="380" height="68" rx="14" fill="white" stroke="#a6c7b9"/><text x="186" y="284" text-anchor="start" font-size="20">准备输入</text><text x="186" y="308" text-anchor="start" font-size="14">首次使用语音时请求麦克风权限</text><path d="M360 325v43" fill="none" stroke="#408572" stroke-width="2" marker-end="url(#arr)"/><rect x="170" y="369" width="380" height="68" rx="14" fill="#daeee3" stroke="#a6c7b9"/><text x="186" y="396" text-anchor="start" font-size="20">当前一方说话</text><text x="186" y="420" text-anchor="start" font-size="14">按当前侧语言收音，句尾停顿后提交</text><path d="M360 437v43" fill="none" stroke="#408572" stroke-width="2" marker-end="url(#arr)"/><rect x="170" y="481" width="380" height="68" rx="14" fill="white" stroke="#a6c7b9"/><text x="186" y="508" text-anchor="start" font-size="20">生成译文</text><text x="186" y="532" text-anchor="start" font-size="14">保留原文，翻译为另一方的语言</text><path d="M360 549v43" fill="none" stroke="#408572" stroke-width="2" marker-end="url(#arr)"/><rect x="170" y="593" width="380" height="68" rx="14" fill="white" stroke="#a6c7b9"/><text x="186" y="620" text-anchor="start" font-size="20">展示并播报译文</text><text x="186" y="644" text-anchor="start" font-size="14">暂停收音；双方看到各自语言的字幕</text><path d="M360 661v43" fill="none" stroke="#408572" stroke-width="2" marker-end="url(#arr)"/><rect x="170" y="705" width="380" height="68" rx="14" fill="#daeee3" stroke="#a6c7b9"/><text x="186" y="732" text-anchor="start" font-size="20">交给另一方</text><text x="186" y="756" text-anchor="start" font-size="14">播完后切换发言侧，再次开放收音</text><path d="M170 739H87V403H168" fill="none" stroke="#408572" stroke-width="2" marker-end="url(#arr)"/><text x="48" y="580" text-anchor="start" font-size="16">下一句</text><path d="M550 291H605" fill="none" stroke="#408572" stroke-width="2" marker-end="url(#arr)"/><rect x="608" y="257" width="340" height="68" rx="14" fill="white" stroke="#a6c7b9"/><text x="624" y="284" text-anchor="start" font-size="20">拒绝授权 → 打字</text><text x="624" y="308" text-anchor="start" font-size="14">选择发言侧，发送后进入翻译</text><path d="M550 403H605" fill="none" stroke="#408572" stroke-width="2" marker-end="url(#arr)"/><rect x="608" y="369" width="340" height="68" rx="14" fill="white" stroke="#a6c7b9"/><text x="624" y="396" text-anchor="start" font-size="20">没听清 → 同侧重说</text><text x="624" y="420" text-anchor="start" font-size="14">嘈杂时可切换按住说话</text><path d="M550 515H605" fill="none" stroke="#408572" stroke-width="2" marker-end="url(#arr)"/><rect x="608" y="481" width="340" height="68" rx="14" fill="white" stroke="#a6c7b9"/><text x="624" y="508" text-anchor="start" font-size="20">断网 → 重试原文</text><text x="624" y="532" text-anchor="start" font-size="14">保留本句，恢复后重新翻译</text><path d="M550 627H605" fill="none" stroke="#408572" stroke-width="2" marker-end="url(#arr)"/><rect x="608" y="593" width="340" height="68" rx="14" fill="white" stroke="#a6c7b9"/><text x="624" y="620" text-anchor="start" font-size="20">点语言键 → 提前接话</text><text x="624" y="644" text-anchor="start" font-size="14">停止播报，切换到指定侧收音</text><rect x="170" y="839" width="778" height="68" rx="14" fill="white" stroke="#a6c7b9"/><text x="186" y="866" text-anchor="start" font-size="20">结束会话</text><text x="186" y="890" text-anchor="start" font-size="14">会话中随时可结束。确认后停止录音和播放、清除本次对话并返回开始页。</text></g></svg>