name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (e.g. 0.0.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])$ ]]; then
            echo "::error::Invalid version '$VERSION'. Use X.Y.Z with digits only (e.g. 0.0.1); Y and Z must be 0-99."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check that the release does not exist
        run: |
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Release or tag $TAG already exists. Choose a new version."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APKs
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleRelease -PappVersion="$VERSION" --no-daemon --console=plain

      - name: Rename and verify APKs
        run: |
          mkdir -p dist
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for abi in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            src="android/app/build/outputs/apk/release/app-$abi-release.apk"
            dst="dist/f2ft-$VERSION-$abi.apk"
            test -f "$src" || { echo "::error::Missing $src"; exit 1; }
            cp "$src" "$dst"
            "$APKSIGNER" verify "$dst"
            echo "$dst: $(du -h "$dst" | cut -f1), native libs: $(unzip -l "$dst" | grep -oE 'lib/[^/]+/' | sort -u | tr '\n' ' ')"
          done
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Write release notes
        run: |
          cat > notes.md <<EOF
          ## 下载哪个 APK？

          | 文件 | 适用设备 |
          |---|---|
          | \`f2ft-$VERSION-arm64-v8a.apk\` | 绝大多数近几年的 Android 手机（64 位 ARM），**推荐** |
          | \`f2ft-$VERSION-armeabi-v7a.apk\` | 较老的 32 位 ARM 手机 |
          | \`f2ft-$VERSION-x86_64.apk\` | 64 位 x86 设备，如电脑上的 Android 模拟器 |
          | \`f2ft-$VERSION-x86.apk\` | 32 位 x86 设备（少见） |
          | \`f2ft-$VERSION-universal.apk\` | 包含所有架构，体积最大；不确定时选这个 |

          ## 安装

          1. 在手机上下载对应的 APK。
          2. 打开文件安装；如果系统提示，允许"安装未知来源应用"。
          3. 打开 App，点「设置」填写 Gemini API Key。

          要求 Android 8.0 及以上，需要联网。
          EOF

      - name: Create release
        run: |
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "f2ft $VERSION" \
            --notes-file notes.md \
            --generate-notes
